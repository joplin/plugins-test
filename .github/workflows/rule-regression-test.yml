name: CodeQL Rule Regression Tests

on:
  push:
    paths:
      - '.github/codeql/**'
      - '.github/workflows/rule-regression-test.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/codeql/**'
      - '.github/workflows/rule-regression-test.yml'
      - 'scripts/**'

permissions:
  contents: read
  security-events: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      plugin_count: ${{ steps.set-matrix.outputs.plugin_count }}
    steps:
      - name: Checkout plugins-test registry
        uses: actions/checkout@v7

      - name: Build plugin matrix
        id: set-matrix
        shell: bash
        run: |
          echo "matrix=$(jq -c '{plugin: .}' .github/codeql/target-plugins.json)" >> "$GITHUB_OUTPUT"
          echo "plugin_count=$(jq 'length' .github/codeql/target-plugins.json)" >> "$GITHUB_OUTPUT"

  scan:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout plugins-test registry
        uses: actions/checkout@v7
        with:
          path: plugins-test

      - name: Checkout target plugin
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.plugin.repo }}
          path: target-plugin

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build regression scanner
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          source-root: target-plugin
          config-file: ./plugins-test/.github/codeql/codeql-config.yml
          queries: ./plugins-test/.github/codeql/codeql_rules/combined-threats.qls

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
          output: codeql-results
          upload: false

      - name: Run CodeQL regression scan
        working-directory: plugins-test/scripts
        env:
          RESULTS_SARIF: ${{ github.workspace }}/codeql-results/javascript.sarif
          PLUGIN_NAME: ${{ matrix.plugin.repo }}
          SOURCE_ROOT: ${{ github.workspace }}/target-plugin
        run: node dist/code-scan/regressionScan.js

      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ strategy.job-index }}
          path: plugins-test/scripts/findings.json
          if-no-files-found: error

  aggregate:
    needs:
      - setup
      - scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugins-test registry
        uses: actions/checkout@v7
        with:
          path: plugins-test

      - name: Download findings
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build regression scanner
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Aggregate CodeQL regression findings
        working-directory: plugins-test/scripts
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/findings
          EXPECTED_PLUGIN_COUNT: ${{ needs.setup.outputs.plugin_count }}
          SCAN_RESULT: ${{ needs.scan.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node dist/code-scan/aggregateFindings.js

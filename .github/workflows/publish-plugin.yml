name: Plugin Publish

on:
  issues:
    types: [labeled]

concurrency:
  group: global-joplin-registry-mutation
  cancel-in-progress: false

jobs:
  initialize-publish:
    if: "${{ github.event.label.name == 'status: approved' && contains(github.event.issue.title, '[Plugin Submission]') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      plugin_name: ${{ steps.init.outputs.plugin_name }}
      version: ${{ steps.init.outputs.version }}
      repository_url: ${{ steps.init.outputs.repository_url }}
      repo_name: ${{ steps.init.outputs.repo_name }}
      commit_hash: ${{ steps.init.outputs.commit_hash }}
      comment_id: ${{ steps.init.outputs.comment_id || steps.ack.outputs.comment_id }}
      should_proceed: ${{ steps.init.outputs.should_proceed }}

    steps:
      - name: Publish initialization
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "# Plugin Publish Status\nValidating the approved submission."
            });
            core.setOutput('comment_id', comment.data.id.toString());

      - name: Checkout plugins-test registry
        uses: actions/checkout@v4
        with:
          path: plugins-test
          persist-credentials: false

      - name: Setup Node.js for scripts
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build scripts
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Initialize publish
        id: init
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          INITIAL_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            return await publish.acknowledgePublishInitialization({github, context, core});

      - name: Handle initialization failure
        if: failure() && steps.ack.outputs.comment_id && steps.init.outputs.should_proceed == ''
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
        with:
          script: |
            const body = [
              "# Plugin Publish Failed",
              "",
              "The publish workflow failed while initializing the trusted publish scripts.",
              "",
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join("\n");

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number.parseInt(process.env.COMMENT_ID, 10),
              body
            });

  build-plugin:
    needs: initialize-publish
    if: ${{ always() && needs.initialize-publish.outputs.should_proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target plugin repository
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.initialize-publish.outputs.repo_name }}
          ref: ${{ needs.initialize-publish.outputs.commit_hash }}
          path: target-plugin
          persist-credentials: false

      - name: Setup Node.js for plugin
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install plugin dependencies
        working-directory: target-plugin
        run: npm ci --no-audit --no-fund

      - name: Build plugin
        working-directory: target-plugin
        run: npm run dist

      - name: Validate plugin artifacts
        working-directory: target-plugin
        run: |
          set -euo pipefail
          jpl_count=$(find publish -maxdepth 1 -type f -name "*.jpl" | wc -l | tr -d ' ')
          manifest_count=$(find publish -maxdepth 1 -type f -name "*.json" | wc -l | tr -d ' ')

          if [ "$jpl_count" -ne 1 ]; then
            echo "Expected exactly one .jpl artifact in publish/, found $jpl_count"
            exit 1
          fi

          if [ "$manifest_count" -ne 1 ]; then
            echo "Expected exactly one manifest JSON artifact in publish/, found $manifest_count"
            exit 1
          fi

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          if-no-files-found: error
          retention-days: 1
          path: |
            target-plugin/publish/*.jpl
            target-plugin/publish/*.json

  publish-plugin:
    needs:
      - initialize-publish
      - build-plugin
    if: ${{ always() && needs.initialize-publish.outputs.should_proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout plugins-test registry
        uses: actions/checkout@v4
        with:
          path: plugins-test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build scripts
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Stop if build failed
        if: ${{ needs.build-plugin.result != 'success' }}
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
          FAILURE_MESSAGE: The plugin artifact build failed in the untrusted build job. Check the build-plugin logs.
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.handleWorkflowFailure({github, context}, process.env.COMMENT_ID, process.env.FAILURE_MESSAGE);
            core.setFailed(process.env.FAILURE_MESSAGE);

      - name: Update phase - Artifact download
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.updatePublishPhase({github, context}, process.env.COMMENT_ID, 3, "Build completed. Downloading the compiled artifact.");

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts
          path: plugin-artifacts

      - name: Locate plugin artifacts
        id: artifacts
        run: |
          set -euo pipefail
          jpl_file=$(find plugin-artifacts -maxdepth 1 -type f -name "*.jpl" | head -n 1)
          manifest_file=$(find plugin-artifacts -maxdepth 1 -type f -name "*.json" | head -n 1)

          if [ -z "$jpl_file" ] || [ -z "$manifest_file" ]; then
            echo "Downloaded artifacts are missing a .jpl or manifest JSON file."
            exit 1
          fi

          echo "jpl_file=$jpl_file" >> "$GITHUB_OUTPUT"
          echo "manifest_file=$manifest_file" >> "$GITHUB_OUTPUT"

      - name: Update phase - Registry publish
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.updatePublishPhase({github, context}, process.env.COMMENT_ID, 4, "Publishing plugin files into the registry.");

      - name: Install publish CLI
        run: npm install -g @joplin/plugin-repo-cli@3.7.3

      - name: Execute publish CLI command
        id: publish_cli
        continue-on-error: true
        working-directory: plugins-test
        run: |
          set -o pipefail
          plugin-repo-cli publish-plugin . "../${{ steps.artifacts.outputs.manifest_file }}" "../${{ steps.artifacts.outputs.jpl_file }}" 2>&1 | tee ../publish-cli.log

      - name: Report publish rejection
        if: steps.publish_cli.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
          PUBLISH_LOG_PATH: ${{ github.workspace }}/publish-cli.log
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            return await publish.reportCliPublishFailure(
              {github, context, core},
              process.env.COMMENT_ID,
              process.env.PUBLISH_LOG_PATH
            );

      - name: Mark plugin as approved
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          MANIFEST_FILE: ${{ github.workspace }}/${{ steps.artifacts.outputs.manifest_file }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            return await publish.markPublishedPluginApproved(
              `${process.env.GITHUB_WORKSPACE}/plugins-test`,
              process.env.MANIFEST_FILE
            );

      - name: Verify published registry files
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          MANIFEST_FILE: ${{ github.workspace }}/${{ steps.artifacts.outputs.manifest_file }}
          JPL_FILE: ${{ github.workspace }}/${{ steps.artifacts.outputs.jpl_file }}
          EXPECTED_VERSION: ${{ needs.initialize-publish.outputs.version }}
          EXPECTED_REPOSITORY_URL: ${{ needs.initialize-publish.outputs.repository_url }}
          EXPECTED_COMMIT_HASH: ${{ needs.initialize-publish.outputs.commit_hash }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            return await publish.verifyPublishedRegistry(
              {core},
              `${process.env.GITHUB_WORKSPACE}/plugins-test`,
              process.env.MANIFEST_FILE,
              process.env.JPL_FILE,
              process.env.EXPECTED_VERSION,
              process.env.EXPECTED_REPOSITORY_URL,
              process.env.EXPECTED_COMMIT_HASH
            );

      - name: Capture registry file changes
        id: registry_changes
        working-directory: plugins-test
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "readme_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "readme_updated=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- manifests.json plugins; then
            echo "registry_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "registry_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update phase - Release update
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.updatePublishPhase({github, context}, process.env.COMMENT_ID, 5, "Updating GitHub release assets and download stats.");

      - name: Execute update-release CLI command
        working-directory: plugins-test
        env:
          JOPLIN_GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          plugin-repo-cli update-release . 2>&1 | tee ../update-release.log

      - name: Capture release and stats changes
        id: release_changes
        working-directory: plugins-test
        run: |
          set -euo pipefail

          if grep -Eq "Uploading|Deleting old asset" ../update-release.log; then
            echo "release_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_updated=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- stats.json; then
            echo "stats_updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "stats_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize publish result
        id: summary
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          MANIFEST_FILE: ${{ github.workspace }}/${{ steps.artifacts.outputs.manifest_file }}
          RELEASE_LOG: ${{ github.workspace }}/update-release.log
          README_UPDATED: ${{ steps.registry_changes.outputs.readme_updated }}
          STATS_UPDATED: ${{ steps.release_changes.outputs.stats_updated }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            return await publish.summarizePublishResult(
              {core},
              `${process.env.GITHUB_WORKSPACE}/plugins-test`,
              process.env.MANIFEST_FILE,
              process.env.RELEASE_LOG,
              process.env.README_UPDATED,
              process.env.STATS_UPDATED
            );

      - name: Update phase - Commit
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.updatePublishPhase({github, context}, process.env.COMMENT_ID, 6, "Committing registry, README, plugin files, and stats changes.");

      - name: Commit and push changes
        working-directory: plugins-test
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md manifests.json manifestOverrides.json stats.json plugins

          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Publish plugin ${{ needs.initialize-publish.outputs.plugin_name }}"
            git push
          fi

      - name: Finish publish
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
          SUMMARY_JSON: ${{ steps.summary.outputs.summary }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.finishPublish({github, context}, process.env.COMMENT_ID, process.env.SUMMARY_JSON);

      - name: Handle failure
        if: failure() && needs.build-plugin.result == 'success' && steps.publish_cli.outcome != 'failure'
        uses: actions/github-script@v7
        env:
          PUBLISH_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/publish/publishManager.js
          COMMENT_ID: ${{ needs.initialize-publish.outputs.comment_id }}
        with:
          script: |
            const publish = require(process.env.PUBLISH_MANAGER_PATH);
            await publish.handleWorkflowFailure({github, context}, process.env.COMMENT_ID);

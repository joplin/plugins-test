name: Plugin Security Scan

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  scan:
    if: contains(github.event.issue.title, '[Plugin Submission]')
    runs-on: ubuntu-latest

    env:
      SCAN_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/dist/code-scan/scanManager.js
    steps:
      - name: Acknowledge scan initialization
        id: ack

        uses: actions/github-script@v9
        with:
          script: |
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "# Security Scan Initializing\nSetting up the scanner and validating the submission payload."
            });
            core.setOutput('comment_id', comment.data.id.toString());

      - name: Checkout plugins-test registry
        uses: actions/checkout@v7
        with:
          path: plugins-test

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build scan scripts
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Phase 1 - Metadata validation and initial check
        id: init
        env:
          INITIAL_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.initialize({github, context, core});

      - name: Phase 2 - Target Repository Validation
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 2);

      - name: Checkout target plugin repository
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.init.outputs.repo_name }}
          ref: ${{ steps.init.outputs.commit_hash }}
          path: target-plugin

      - name: Validate target repository source
        id: sourcecheck
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.validateTargetRepository({github, context, core}, process.env.INIT_COMMENT_ID, 'target-plugin');

      - name: Phase 3 - CodeQL initialization
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 3);

      - name: Initialize CodeQL
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          source-root: target-plugin
          config-file: ./plugins-test/.github/codeql/codeql-config.yml
          queries: ./plugins-test/.github/codeql/codeql_rules/combined-threats.qls

      - name: Phase 4 - SAST analysis
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 4);

      - name: Perform CodeQL analysis
        id: codeql-analysis
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
          output: codeql-results
          upload: false

      - name: Phase 5 - Report generation
        if: always() && steps.init.outputs.should_proceed == 'true' && steps.sourcecheck.outputs.handled_failure != 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 5);

      - name: Finalize report
        id: finalize
        if: always() && steps.init.outputs.should_proceed == 'true' && steps.sourcecheck.outputs.handled_failure != 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
          INIT_REPO_URL: ${{ steps.init.outputs.repository_url }}
          INIT_COMMIT_HASH: ${{ steps.init.outputs.commit_hash }}
          CODEQL_ANALYSIS_OUTCOME: ${{ steps.codeql-analysis.outcome }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.generateFinalReport(
              {github, context, core},
              process.env.INIT_COMMENT_ID,
              'codeql-results/javascript.sarif',
              process.env.INIT_REPO_URL,
              process.env.INIT_COMMIT_HASH,
              process.env.CODEQL_ANALYSIS_OUTCOME
            );

      - name: Handle unreported workflow failure
        if: failure() && steps.ack.outputs.comment_id && steps.init.outputs.handled_failure != 'true' && steps.sourcecheck.outputs.handled_failure != 'true' && steps.finalize.outputs.handled_failure != 'true' && steps.finalize.outcome != 'success'
        env:
          ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              "# Security Scan Failed",
              "",
              "The workflow encountered a system error before it could complete.",
              "",
              `**Workflow Run:** [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join("\n");

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number.parseInt(process.env.ACK_COMMENT_ID, 10),
              body
            });
